[package]
authors = ["Lunes"]
name = "pallet-common"
version = "4.0.0-dev"
description = "Lunes runtime"
homepage = "https://lunes.io/"
edition = "2021"
license = "Unlicense"
publish = false
repository = "https://github.com/lunes-platform/lunes-nightly"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = [
	"derive",
] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
frame-benchmarking = { default-features = false, optional = true, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }
frame-support = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }
frame-system = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2412" }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]
